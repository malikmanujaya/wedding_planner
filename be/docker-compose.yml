services:
  postgres:
    image: postgres:16-alpine
    container_name: aisle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wedding_planner
      POSTGRES_USER: aisle
      POSTGRES_PASSWORD: aisle
    ports:
      - "5432:5432"
    volumes:
      - aisle_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisle -d wedding_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: aisle-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aisle.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - aisle_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aisle_pg_data:
  aisle_pgadmin_data:
