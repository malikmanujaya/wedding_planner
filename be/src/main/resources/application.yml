spring:
  application:
    name: wedding-planner-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wedding_planner}
    username: ${SPRING_DATASOURCE_USERNAME:aisle}
    password: ${SPRING_DATASOURCE_PASSWORD:aisle}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 110MB
      max-request-size: 120MB

server:
  port: ${SERVER_PORT:18080}

app:
  upload:
    dir: ./uploads
  jwt:
    secret: ${APP_JWT_SECRET:wedding-planner-dev-secret-change-me-in-production-32chars-min}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000}
  seed:
    superadmin:
      email: malikmanujayawijesuriya98@gmail.com
      # \u0024 = $ (avoids Spring placeholder parsing)
      password: "Malik98\u0024"
      full-name: Super Admin

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
